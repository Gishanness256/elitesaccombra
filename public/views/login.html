<section id="login">
  <img src="images/logo.jpg" alt="Elite SACCO Mbarara">

  <form id="loginForm">
    <h1>Login</h1>

    <label for="id">Email or phone number</label>
    <input id="id" name="id" type="text" autocomplete="username" required>

    <label for="pw">Password</label>
    <input id="pw" name="pw" type="password" autocomplete="current-password" required>

    <div id="lerr" class="msg err" role="alert"></div>

    <button class="btn" type="submit">Login</button>

    <p class="alt">
      Don't have an account?
      <a href="#" id="openReg">Create Account</a>
    </p>

    <p class="alt" style="margin-top:.5rem;font-size:.82rem">
      Forgot your password or login handle? Contact the System Admin to reset it.
    </p>
  </form>
</section>
